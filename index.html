    <meta name="description" content="University-level peer-to-peer skill-sharing platform. Share skills, help others, and grow together." />
    <meta property="og:title" content="Pairly — Share Skills. Help Others. Grow Together." />
    <meta property="og:description" content="University-level peer-to-peer skill-sharing platform. Share skills, help others, and grow together." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var activeFetch = origFetch ? origFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property redefinition is restricted
        }

        // Catch and suppress errors originated by browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var stack = (event.reason && event.reason.stack) || '';
          var msg = (event.reason && event.reason.message) || String(event.reason);
          if (
            stack.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

  </body>
